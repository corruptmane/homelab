---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-configs
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/configs
  prune: true
  dependsOn:
    - name: infrastructure-controllers
  postBuild:
    substituteFrom:
      # Rendered by configs/zitadel ESO from SSM into flux-system —
      # kustomize-controller resolves substitution sources only inside the
      # Kustomization's own namespace. Reconciliation fails loudly until
      # /homelab/cnpg-backup-bucket-name exists; self-heals afterwards.
      - kind: Secret
        name: zitadel-db-destination
