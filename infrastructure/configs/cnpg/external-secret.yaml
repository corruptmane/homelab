---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-backup-creds
  namespace: cnpg-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: cnpg-backup-creds
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: /homelab/cnpg-backup-access-key-id
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: /homelab/cnpg-backup-secret-access-key
