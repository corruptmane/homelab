---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-master-key
  namespace: zitadel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: zitadel-master-key
    creationPolicy: Owner
  data:
    - secretKey: masterkey
      remoteRef:
        key: /homelab/zitadel-master-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-admin-password
  namespace: zitadel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: zitadel-admin-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: /homelab/zitadel-admin-password
---
# Backup credential chain for the Zitadel CNPG cluster (mirrors the cvgen
# pattern, ADR 0013): tofu -> SSM -> ESO -> Secret zitadel-db-backup in THIS
# namespace, because CNPG barmanObjectStore credential refs are
# namespace-local. template.data composes the final keys (Replace policy —
# the default — so exactly these three keys land in the Secret):
#   - ACCESS_KEY_ID / SECRET_ACCESS_KEY are wired into
#     spec.backup.barmanObjectStore.s3Credentials in cnpg-cluster.yaml.
#   - ZITADEL_BACKUP_DESTINATION is composed as s3://<bucket>/zitadel; the
#     bucket name never appears in this repo. The Cluster's destinationPath
#     placeholder ${ZITADEL_BACKUP_DESTINATION} is substituted by Flux from
#     Secret zitadel-db-destination in flux-system (next document) BEFORE
#     apply, failing reconciliation loudly while the SSM parameter is absent.
# cnpg.io/reload lives INSIDE template.metadata.labels on purpose: defining
# a template suppresses ExternalSecret label copying, so a label on the
# ExternalSecret metadata would never reach the generated Secret — and CNPG
# watches that label to hot-reload rotated credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-db-backup
  namespace: zitadel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: zitadel-db-backup
    creationPolicy: Owner
    template:
      metadata:
        labels:
          cnpg.io/reload: ""
      data:
        ACCESS_KEY_ID: "{{ .access_key_id }}"
        SECRET_ACCESS_KEY: "{{ .secret_access_key }}"
        ZITADEL_BACKUP_DESTINATION: "s3://{{ .bucket_name }}/zitadel"
  data:
    - secretKey: access_key_id
      remoteRef:
        key: /homelab/cnpg-backup-access-key-id
    - secretKey: secret_access_key
      remoteRef:
        key: /homelab/cnpg-backup-secret-access-key
    - secretKey: bucket_name
      remoteRef:
        key: /homelab/cnpg-backup-bucket-name
---
# Substitution-only twin of zitadel-db-backup, pinned to flux-system because
# kustomize-controller resolves postBuild.substituteFrom strictly inside the
# Kustomization's own namespace (clusters/homelab/infrastructure-configs.yaml
# runs there). Renders ONLY the destination variable that Flux substitutes
# into the Cluster's destinationPath.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-db-destination
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: zitadel-db-destination
    creationPolicy: Owner
    template:
      data:
        ZITADEL_BACKUP_DESTINATION: "s3://{{ .bucket_name }}/zitadel"
  data:
    - secretKey: bucket_name
      remoteRef:
        key: /homelab/cnpg-backup-bucket-name
