---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: grafana
      version: "10.5.15"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    replicas: 1

    persistence:
      enabled: false

    envValueFrom:
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
        secretKeyRef:
          name: grafana-oidc
          key: client-id
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
        secretKeyRef:
          name: grafana-oidc
          key: client-secret
    grafana.ini:
      server:
        root_url: https://grafana.corruptmane.xyz
      auth:
        disable_login_form: false
      auth.generic_oauth:
        enabled: true
        name: Zitadel
        allow_sign_up: true
        scopes: openid profile email
        auth_url: https://auth.corruptmane.xyz/oauth/v2/authorize
        token_url: https://auth.corruptmane.xyz/oauth/v2/token
        api_url: https://auth.corruptmane.xyz/oidc/v1/userinfo
        use_pkce: true
        # TODO: switch to proper RBAC using Zitadel project roles
        skip_org_role_sync: false
      users:
        auto_assign_org_role: Admin

    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: VictoriaMetrics
            type: prometheus
            url: http://vmsingle-victoria-metrics-victoria-metrics-k8s-stack:8428
            access: proxy
            isDefault: true
          - name: Prometheus
            type: prometheus
            url: http://prometheus-server:80
            access: proxy
          - name: VictoriaLogs
            type: loki
            url: http://victoria-logs-victoria-logs-single-server:9428/select/logsql/loki
            access: proxy
          - name: Loki
            type: loki
            url: http://loki:3100
            access: proxy
          - name: VictoriaTraces
            type: tempo
            url: http://victoria-traces-vt-single-server:10428/vt
            access: proxy
          - name: Tempo
            type: tempo
            url: http://tempo:3200
            access: proxy

    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        searchNamespace: ALL

    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default

    dashboards:
      default:
        node-exporter:
          gnetId: 1860
          revision: 42
          datasource: VictoriaMetrics
        kubernetes-cluster:
          gnetId: 15661
          revision: 2
          datasource: VictoriaMetrics
        kubernetes-pods:
          gnetId: 15760
          revision: 37
          datasource: VictoriaMetrics
        kubernetes-namespaces:
          gnetId: 15758
          revision: 44
          datasource: VictoriaMetrics
        kubernetes-nodes:
          gnetId: 15759
          revision: 40
          datasource: VictoriaMetrics
        longhorn:
          gnetId: 16888
          revision: 11
          datasource: VictoriaMetrics
        cnpg:
          gnetId: 20417
          revision: 4
          datasource: VictoriaMetrics

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
