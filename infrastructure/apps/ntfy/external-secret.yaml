---
# Renders the full ntfy server.yml with the admin bcrypt hash and agent
# access token substituted from SSM, so neither lands in git.
#
# Auth model (see https://docs.ntfy.sh/config/#access-control):
#   - auth-default-access: deny-all  -> anonymous clients get nothing
#   - one provisioned admin user; tokens grant full access to that user's
#     account, so a separate "agent" user would add no isolation
#   - the admin token is used by both the publishing agent and the phones
#     subscribing to homelab-* topics
#
# SSM prerequisites:
#   /homelab/ntfy-admin-password-hash : `docker run --rm -it binwiederhier/ntfy user hash`
#   /homelab/ntfy-agent-token         : `docker run --rm binwiederhier/ntfy token generate`
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-config
  namespace: ntfy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: ntfy-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        server.yml: |
          base-url: "https://notify.corruptmane.xyz"
          listen-http: ":80"
          behind-proxy: true

          # message + attachment cache on the Longhorn PVC
          cache-file: "/var/cache/ntfy/cache.db"
          cache-duration: "48h"
          attachment-cache-dir: "/var/cache/ntfy/attachments"
          attachment-file-size-limit: "15M"
          attachment-total-size-limit: "1G"
          attachment-expiry-duration: "6h"

          # private instance: deny-all + provisioned admin from SSM
          auth-file: "/var/cache/ntfy/user.db"
          auth-default-access: "deny-all"
          auth-users:
            - "admin:{{ .adminPasswordHash }}:admin"
          auth-tokens:
            - "admin:{{ .agentToken }}:agent"

          # web UI login for humans, no self-signup
          enable-login: true
          enable-signup: false
  data:
    - secretKey: adminPasswordHash
      remoteRef:
        key: /homelab/ntfy-admin-password-hash
    - secretKey: agentToken
      remoteRef:
        key: /homelab/ntfy-agent-token
