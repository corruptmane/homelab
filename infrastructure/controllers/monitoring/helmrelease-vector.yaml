---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vector
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: vector
      version: "0.50.0"
      sourceRef:
        kind: HelmRepository
        name: vector
        namespace: flux-system
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    role: Agent

    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi

    customConfig:
      data_dir: /vector-data-dir

      api:
        enabled: true
        address: 0.0.0.0:8686

      sources:
        kubernetes_logs:
          type: kubernetes_logs

      sinks:
        loki:
          type: loki
          inputs:
            - kubernetes_logs
          endpoint: http://loki.monitoring.svc:3100
          encoding:
            codec: json
          labels:
            namespace: "{{ `{{ kubernetes.pod_namespace }}` }}"
            pod: "{{ `{{ kubernetes.pod_name }}` }}"
            container: "{{ `{{ kubernetes.container_name }}` }}"
            node: "{{ `{{ kubernetes.pod_node_name }}` }}"

        victoria_logs:
          type: elasticsearch
          inputs:
            - kubernetes_logs
          endpoint: http://victoria-logs-victoria-logs-single-server.monitoring.svc:9428/insert/elasticsearch/
          mode: bulk
          api_version: v8
          query:
            _msg_field: message
            _time_field: timestamp
            _stream_fields: stream,kubernetes.pod_namespace,kubernetes.pod_name,kubernetes.container_name
          healthcheck:
            enabled: false
