---
# Renders the full alertmanager.yaml with the Telegram bot token and chat id
# substituted from SSM. Routing: Watchdog (always-firing heartbeat) and
# info-level alerts are dropped; everything else — cluster rule alerts and
# Flux failure events forwarded by notification-controller — goes to Telegram.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: alertmanager-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          route:
            receiver: telegram
            group_by: [alertname, namespace]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            routes:
              - matchers: ['alertname="Watchdog"']
                receiver: blackhole
              - matchers: ['severity=~"info|none"']
                receiver: blackhole
          receivers:
            - name: blackhole
            - name: telegram
              telegram_configs:
                - bot_token: "{{ .token }}"
                  chat_id: {{ .chatId }}
                  send_resolved: true
  data:
    - secretKey: token
      remoteRef:
        key: /homelab/telegram-bot-token
    - secretKey: chatId
      remoteRef:
        key: /homelab/telegram-chat-id
