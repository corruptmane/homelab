---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-collector
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: opentelemetry-collector
      version: "0.146.1"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    mode: deployment
    image:
      repository: otel/opentelemetry-collector-contrib

    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi

    config:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

      processors:
        batch:
          timeout: 5s
          send_batch_size: 1024

      exporters:
        otlphttp/victoriametrics:
          metrics_endpoint: http://vmsingle-victoria-metrics-victoria-metrics-k8s-stack.monitoring.svc:8428/opentelemetry/v1/metrics
          tls:
            insecure: true
        otlphttp/victorialogs:
          logs_endpoint: http://victoria-logs-victoria-logs-single-server.monitoring.svc:9428/insert/opentelemetry/v1/logs
          tls:
            insecure: true
        otlphttp/victoriatraces:
          endpoint: http://victoria-traces-vt-single-server.monitoring.svc:10428
          tls:
            insecure: true

      service:
        pipelines:
          metrics:
            receivers:
              - otlp
            processors:
              - batch
            exporters:
              - otlphttp/victoriametrics
          logs:
            receivers:
              - otlp
            processors:
              - batch
            exporters:
              - otlphttp/victorialogs
          traces:
            receivers:
              - otlp
            processors:
              - batch
            exporters:
              - otlphttp/victoriatraces
