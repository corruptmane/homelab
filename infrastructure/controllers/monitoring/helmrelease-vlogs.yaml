---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: victoria-logs-single
      version: "0.11.29"
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: flux-system
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    server:
      retentionPeriod: 7d
      persistentVolume:
        enabled: true
        storageClassName: longhorn
        size: 5Gi
