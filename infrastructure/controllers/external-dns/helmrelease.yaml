---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 1h
  chart:
    spec:
      chart: external-dns
      version: "1.19.0"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      interval: 24h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    sources:
      - gateway-httproute
      - gateway-grpcroute
      - gateway-tlsroute

    provider:
      name: pihole

    registry: noop
    policy: upsert-only

    extraArgs:
      - --pihole-server=http://192.168.1.53
      - --pihole-api-version=6
      - --pihole-tls-skip-verify

    env:
      - name: EXTERNAL_DNS_PIHOLE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: pihole-password
            key: password
