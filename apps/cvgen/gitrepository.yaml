---
# cvgen manifests live in the app repo (corruptmane/cv, deploy/k8s/);
# the deploy key needs WRITE access — Flux image automation pushes image
# tag bumps back to it.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: cvgen
  namespace: flux-system
spec:
  interval: 1m
  url: ssh://git@github.com/corruptmane/cv
  ref:
    branch: main
  secretRef:
    name: cvgen-deploy-key
