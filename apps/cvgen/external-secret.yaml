---
# Flux-side substitution secret for the cvgen CNPG backup destination.
# kustomize-controller resolves postBuild.substituteFrom sources ONLY in
# the Kustomization's own namespace (flux-system), so this fleet-owned
# ExternalSecret renders just the destination variable consumed by the
# cvgen-db Kustomization's postBuild step. The CNPG operator itself reads
# its credentials from Secret cvgen-db-backup in ns cvgen, rendered by the
# cv repo's deploy/k8s/secrets (ADR 0013 chain: tofu -> SSM -> ESO ->
# Secret); the real bucket name never appears in git on either side.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cvgen-db-destination
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: cvgen-db-destination
    creationPolicy: Owner
    template:
      data:
        CVGEN_BACKUP_DESTINATION: "s3://{{ .bucket_name }}/cvgen"
  data:
    - secretKey: bucket_name
      remoteRef:
        key: /homelab/cnpg-backup-bucket-name
